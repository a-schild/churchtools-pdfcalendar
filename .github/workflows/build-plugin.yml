name: Releases

on: 
  push:
    branches: [ main ]
    tags:
    - 'v*'

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    name: Build and Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build project
        run: |
          cd src
          composer install --no-dev --optimize-autoloader
      - name: Remove unnecessary vendor files
        run: |
          # Remove TCPDF fonts except freesans and helvetica families
          cd src/vendor/tecnickcom/tcpdf/fonts
          find . -maxdepth 1 -type d ! -name '.' -exec rm -rf {} +
          find . -maxdepth 1 -type f \
            ! -name 'freesans*' \
            ! -name 'helvetica*' \
            ! -name '.htaccess' \
            -delete
          cd -
          # Remove TCPDF tools directory
          rm -rf src/vendor/tecnickcom/tcpdf/tools
          # Remove test directories
          find src/vendor -type d \( -name 'tests' -o -name 'test' -o -name 'Tests' -o -name 'Test' \) -exec rm -rf {} + 2>/dev/null || true
          # Remove doc directories
          find src/vendor -type d \( -name 'docs' -o -name 'doc' \) -exec rm -rf {} + 2>/dev/null || true
          # Remove example directories
          find src/vendor -type d -name 'examples' -exec rm -rf {} + 2>/dev/null || true
          # Remove CI/build config files from vendor
          find src/vendor -name 'phpunit.xml*' -o -name 'phpstan.neon*' -o -name '.php-cs-fixer*' \
            -o -name 'codeception.yml' -o -name 'infection.json*' -o -name '.editorconfig' \
            -o -name 'buildPhar.php' | xargs rm -f 2>/dev/null || true
          find src/vendor -type d -name '.github' -exec rm -rf {} + 2>/dev/null || true
          # Remove markdown files from vendor (keep LICENSE files)
          find src/vendor \( -name 'README.md' -o -name 'CHANGELOG*' -o -name 'CONTRIBUTING.md' \
            -o -name 'UPGRADE*.md' \) -delete 2>/dev/null || true
      - name: Create artifact
        uses: montudor/action-zip@v1
        with:
          args: zip -X -r ${{ github.event.repository.name }}-${{ github.ref_name }}.zip . -x *.git* .claude/* CLAUDE.md src/nbproject/* src/composer.lock
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Strip leading 'v' from the tag to match CHANGELOG headings
          VERSION="${GITHUB_REF_NAME#v}"
          # Escape dots so 1.2.1 cannot match a heading like 1x2x1
          VERSION_RE="${VERSION//./\.}"
          # Headings are "## [1.3.0 2026-08-28]" or, older ones, "## [1.2.1]",
          # so the version must be followed by a space or the closing bracket.
          awk "/^## \[${VERSION_RE}[] ]/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md > release_notes.md
          if [ -s release_notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release (with CHANGELOG notes)
        if: steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ github.event.repository.name }}-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file release_notes.md
      - name: Create GitHub Release (auto-generated notes)
        if: steps.notes.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ github.event.repository.name }}-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
